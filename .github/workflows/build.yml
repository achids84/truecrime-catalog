name: build

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

# Nothing is granted by default; each job asks for what it needs.
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # commit data/idmap.json back
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check catalogue config
        run: npm run check # offline; a bad config fails here, before any TMDB call and before the deploy job
      - name: Build
        run: npm run build:ci
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
      - name: Commit id map
        run: |
          if [ -z "$(git status --porcelain -- data/idmap.json)" ]; then
            echo "idmap unchanged"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/idmap.json
            git commit -m "chore: id map [skip ci]"
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
